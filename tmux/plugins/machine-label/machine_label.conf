# vim:set ft=tmux:
# machine-label status module for catppuccin tmux
%hidden MODULE_NAME="machine_label"

# Determine icon and text based on hostname
%if "#{==:#{host},hu-manurodr-lv}"
  set -ogq "@catppuccin_${MODULE_NAME}_icon" "󰒋 "
  set -ogq "@catppuccin_${MODULE_NAME}_text" " Dev Server | Ubuntu #(grep VERSION_ID /etc/os-release | cut -d'\"' -f2)"
%else
  set -ogq "@catppuccin_${MODULE_NAME}_icon" " "
  set -ogq "@catppuccin_${MODULE_NAME}_text" " Laptop | WSL2"
%endif

set -ogqF "@catppuccin_${MODULE_NAME}_color" "#{E:@thm_blue}"

source -F "#{HOME}/.config/tmux/plugins/catppuccin/tmux/utils/status_module.conf"
