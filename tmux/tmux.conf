setw -g mode-keys vi
# Bind 'y' to copy to system clipboard and cancel selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"
# Bind 'v' to begin selection
bind-key -T copy-mode-vi v send-keys -X begin-selection

unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Options to make tmux more pleasant
set -g mouse on
set -g default-terminal "tmux-256color"

# Enable passthrough for image rendering (kitty graphics protocol)
set -g allow-passthrough on
set -ga update-environment "TERM_PROGRAM WEZTERM_PANE WEZTERM_EXECUTABLE"

# Configure the catppuccin plugin
set -g @catppuccin_flavor "frappe"
set -g @catppuccin_window_status_style "rounded"

# Load catppuccin
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux
# For TPM, instead use `run ~/.tmux/plugins/tmux/catppuccin.tmux`

# Load machine-label module (must be after catppuccin)
source ~/.config/tmux/plugins/machine-label/machine_label.conf

# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_machine_label}"

# run ~/.config/tmux/plugins/tmux-plugins/tmux-cpu/cpu.tmux
# run ~/.config/tmux/plugins/tmux-plugins/tmux-battery/battery.tmux
